; PlatformIO — Teensy 4.1 TCA IMU/GNSS SIM
; Open this folder in VS Code/Cursor with the PlatformIO IDE extension.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 921600
; Custom upload avoids PlatformIO's teensy_reboot race that causes
; "error writing to Teensy" on some Linux hosts.
upload_protocol = custom
upload_command = bash $PROJECT_DIR/scripts/teensy_upload.sh $SOURCE
lib_deps =
	mikalhart/TinyGPSPlus@^1.1.0

; Optional: raise USB stack / heap comfort for large INS buffers
build_flags =
	-DUSB_SERIAL
	-Wno-unused-variable
	-Wno-unused-but-set-variable
